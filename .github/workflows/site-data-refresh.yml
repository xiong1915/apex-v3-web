name: Website post-race refresh
on:
  schedule:
    - cron: '*/15 * * * 5,6,0'
    - cron: '*/15 0-5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-post-race-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the authenticated post-race refresh endpoint on the Vercel origin
        shell: bash
        env:
          POST_RACE_REFRESH_SECRET: ${{ secrets.POST_RACE_REFRESH_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          // Call the Vercel origin directly. This authenticated request never
          // traverses Cloudflare, so Bot Fight Mode cannot challenge it, and
          // the public website keeps its existing protection unchanged.
          const base='https://f1-race-reminder-cloud.vercel.app';
          const season=String(new Date().getUTCFullYear());
          const secret=process.env.POST_RACE_REFRESH_SECRET;
          if(!secret){console.error('POST_RACE_REFRESH_SECRET is not configured in GitHub Secrets.');process.exit(1);}
          const res=await fetch(`${base}/api/cron/post-race-refresh?season=${season}`,{
            method:'POST',
            headers:{authorization:`Bearer ${secret}`},
            signal:AbortSignal.timeout(120000)
          });
          const body=await res.json().catch(()=>null);
          if(!res.ok)throw new Error(`post-race-refresh: HTTP ${res.status} ${body?.error||''}`.trim());
          if(!body?.refreshed){console.log('Outside bounded post-session window; no data refresh.');process.exit(0);}
          console.log(body.reconciled
            ?'Results and standings reconciled; polling stopped for this session.'
            :'Refresh completed; reconciliation pending. Next bounded attempt in 15 minutes.');
          NODE
